# ⬆️ Dependabot: opens pull requests to update dependencies, once a month, grouped so there are only a few.
# Each pull request runs the required checks (build, e2e) like any other. Security updates (when turned on in
# the repository settings) come as soon as GitHub knows about a vulnerability, separately from this schedule.
version: 2
updates:
    # npm packages (dev dependencies only: the plugin bundles everything into main.js)
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 5
      commit-message:
          prefix: '⬆️ build'
          include: scope
      groups:
          # Minor and patch updates together in one pull request; each major update gets its own
          npm-minor-and-patch:
              update-types: [minor, patch]
      ignore:
          # wdio-obsidian-service supports WebdriverIO 9 only (peer dependency). Update together when it supports 10.
          - dependency-name: 'webdriverio'
            update-types: ['version-update:semver-major']
          - dependency-name: '@wdio/*'
            update-types: ['version-update:semver-major']
          # typescript-eslint supports TypeScript below 6.1 only. Remove this when it supports newer versions.
          - dependency-name: 'typescript'
            versions: ['>= 6.1']
          # eslint-plugin-obsidianmd requires @eslint/js 9. Update ESLint and @eslint/js to 10 together once it supports them.
          - dependency-name: 'eslint'
            update-types: ['version-update:semver-major']
          - dependency-name: '@eslint/js'
            update-types: ['version-update:semver-major']
          # CI and releases run on Node.js 24 (actions/setup-node), so the Node.js types stay on 24.
          # Raise both together when moving to a newer Node.js.
          - dependency-name: '@types/node'
            versions: ['>= 25']

    # Actions used in .github/workflows
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: '⬆️ ci'
          include: scope
      groups:
          github-actions:
              patterns: ['*']
