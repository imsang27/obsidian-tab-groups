name: E2E tests

# 🖱️ Launches Obsidian with the plugin and a test vault, then clicks and types like a user (tests/e2e).
# Runs on pull requests, and on push only for main.
# Only the plugin, the E2E tests and their setup matter here (see on.push.paths). "e2e (latest)" and "e2e (earliest)"
# are required checks, so they always report on pull requests: when none of those files change, the job runs
# but skips its steps.
on:
    push:
        branches: [main]
        paths:
            - 'src/**'
            - 'tests/e2e/**'
            - 'styles.css'
            - 'manifest.json'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.json'
            - 'esbuild.config.mjs'
            - 'wdio.conf.mts'
            - '.npmrc'
            - '.github/workflows/e2e.yml'
    pull_request:

# A new push cancels the run still going for an older commit of the same branch or pull request.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        # The latest Obsidian, and the oldest one the plugin supports (minAppVersion in manifest.json)
        strategy:
            fail-fast: false
            matrix:
                obsidian: [latest, earliest]
        name: e2e (${{ matrix.obsidian }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            OBSIDIAN_CACHE: ${{ github.workspace }}/.obsidian-cache
            OBSIDIAN_VERSION: ${{ matrix.obsidian }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            # 💡 Only the files that can change this check's result (plugin, E2E tests and their setup). Same list as on.push.paths above.
            - name: Check for relevant changes
              id: changes
              run: |
                  if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
                  if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(src/|tests/e2e/|styles\.css$|manifest\.json$|package(-lock)?\.json$|tsconfig\.json$|esbuild\.config\.mjs$|wdio\.conf\.mts$|\.npmrc$|\.github/workflows/e2e\.yml$)'; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "code=false" >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/setup-node@v7
              if: steps.changes.outputs.code == 'true'
              with:
                  node-version: 24
                  cache: 'npm'
            - if: steps.changes.outputs.code == 'true'
              run: npm ci
            # Downloaded Obsidian versions. A new Obsidian release just adds to the cache.
            - uses: actions/cache@v6
              if: steps.changes.outputs.code == 'true'
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-${{ github.run_id }}
                  restore-keys: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-
            - if: steps.changes.outputs.code == 'true'
              run: npx tsc -noEmit -p tests/e2e
            # Obsidian needs a screen, so run it on a virtual one.
            - if: steps.changes.outputs.code == 'true'
              run: xvfb-run --auto-servernum npm run test:e2e
