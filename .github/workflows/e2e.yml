name: E2E tests

# 🖱️ Launches Obsidian with the plugin and a test vault, then clicks and types like a user (tests/e2e).
# Runs on pull requests, and on push only for main.
# "e2e (latest)" and "e2e (earliest)" are required checks, so they always report on pull requests: when only
# docs or GitHub templates change, the job runs but skips its steps.
on:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'LICENSE'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/pull_request_template.md'
            - '.github/labeler.yml'
    pull_request:

# A new push cancels the run still going for an older commit of the same branch or pull request.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        # The latest Obsidian, and the oldest one the plugin supports (minAppVersion in manifest.json)
        strategy:
            fail-fast: false
            matrix:
                obsidian: [latest, earliest]
        name: e2e (${{ matrix.obsidian }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            OBSIDIAN_CACHE: ${{ github.workspace }}/.obsidian-cache
            OBSIDIAN_VERSION: ${{ matrix.obsidian }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            # Docs and GitHub templates only (Markdown outside tests/, docs/, LICENSE, issue/PR templates, labeler.yml)?
            - name: Check for code changes
              id: changes
              run: |
                  if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
                  code=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | awk '!/^tests\// && (/\.md$/ || /^docs\// || /^LICENSE$/ || /^\.github\/ISSUE_TEMPLATE\// || /^\.github\/labeler\.yml$/) {next} {print}')
                  if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"
            - uses: actions/setup-node@v6
              if: steps.changes.outputs.code == 'true'
              with:
                  node-version: 24
                  cache: 'npm'
            - if: steps.changes.outputs.code == 'true'
              run: npm ci
            # Downloaded Obsidian versions. A new Obsidian release just adds to the cache.
            - uses: actions/cache@v4
              if: steps.changes.outputs.code == 'true'
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-${{ github.run_id }}
                  restore-keys: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-
            - if: steps.changes.outputs.code == 'true'
              run: npx tsc -noEmit -p tests/e2e
            # Obsidian needs a screen, so run it on a virtual one.
            - if: steps.changes.outputs.code == 'true'
              run: xvfb-run --auto-servernum npm run test:e2e
