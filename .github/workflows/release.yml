name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            # 🚀 The tag must match the version in manifest.json and be listed in versions.json,
            # or Obsidian won't offer the update.
            - name: Check version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version=$(node -p "require('./manifest.json').version")
                  if [ "$tag" != "$version" ]; then
                    echo "::error file=manifest.json::Tag $tag doesn't match manifest.json version $version"
                    exit 1
                  fi
                  if ! node -e "process.exit(require('./versions.json')['$tag'] ? 0 : 1)"; then
                    echo "::error file=versions.json::versions.json has no entry for $tag"
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
