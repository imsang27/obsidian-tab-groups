name: Release Obsidian plugin

# 🚀 Two ways to release:
# - Actions → "Release Obsidian plugin" → Run workflow, then enter a version (e.g. 1.3.7).
#   Makes the version commit (manifest.json, versions.json, package.json) on a temporary branch,
#   runs the same checks as pull requests on it (build, lint, unit tests, E2E on the latest and the oldest
#   supported Obsidian), and only if they all pass puts it on main, tags it, builds, and publishes the release
#   with notes generated from the merged PRs. If a check fails, main and the releases stay as they were.
# - Push a tag yourself (after bumping the version in a PR): builds and creates a draft release.
#
# 💡 main requires the "build", "e2e (latest)" and "e2e (earliest)" checks, even for direct pushes.
# The version commit is checked here, so this workflow marks those checks as passed on that commit
# before pushing it to main. No bypass or deploy key is needed.
on:
    workflow_dispatch:
        inputs:
            version:
                description: 'New version (x.y.z, no leading v)'
                required: true
                type: string
    push:
        tags:
            - '*'

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # 1️⃣ Version commit on a temporary branch (release/x.y.z)
    prepare:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        outputs:
            sha: ${{ steps.commit.outputs.sha }}
        env:
            VERSION: ${{ inputs.version }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Check the version
              run: |
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::Version must look like 1.2.3 (no leading v): $VERSION"
                    exit 1
                  fi
                  current=$(node -p "require('./manifest.json').version")
                  newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
                  if [ "$current" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
                    echo "::error::$VERSION must be newer than the current version $current"
                    exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
                    echo "::error::Tag $VERSION already exists"
                    exit 1
                  fi
            - name: Make the version commit
              id: commit
              run: |
                  npm version "$VERSION" --no-git-tag-version
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add manifest.json versions.json package.json package-lock.json
                  git commit -m "🔖 release: $VERSION"
                  git push --force origin "HEAD:refs/heads/release/$VERSION"
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # 2️⃣ The same checks as pull requests, on the version commit
    build:
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.sha }}
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test

    e2e:
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                obsidian: [latest, earliest]
        name: e2e (${{ matrix.obsidian }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            OBSIDIAN_CACHE: ${{ github.workspace }}/.obsidian-cache
            OBSIDIAN_VERSION: ${{ matrix.obsidian }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.sha }}
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-${{ github.run_id }}
                  restore-keys: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-
            - run: npx tsc -noEmit -p tests/e2e
            - run: xvfb-run --auto-servernum npm run test:e2e

    # 3️⃣ All passed: mark the checks on the version commit, put it on main, tag, build and release
    publish:
        needs: [prepare, build, e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            statuses: write
            id-token: write
            attestations: write
        env:
            VERSION: ${{ inputs.version }}
            SHA: ${{ needs.prepare.outputs.sha }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.sha }}
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            # 💡 Same names as the required checks. They ran in this workflow (jobs build and e2e above).
            - name: Mark the checks as passed on the version commit
              run: |
                  run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  for check in "build" "e2e (latest)" "e2e (earliest)"; do
                    gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
                      -f state=success -f context="$check" -f target_url="$run_url" \
                      -f description="Passed in the release workflow" >/dev/null
                  done

            # 💡 Fast-forward only: if main moved while the checks ran, this fails and nothing is released.
            - name: Put the version commit on main and tag it
              run: |
                  git tag "$VERSION" "$SHA"
                  git push origin "$SHA:refs/heads/main" "refs/tags/$VERSION"

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Create release
              run: |
                  gh release create "$VERSION" --title="$VERSION" --generate-notes --latest \
                    main.js manifest.json styles.css

            - name: Next step
              run: |
                  {
                    echo "Released [$VERSION](https://github.com/${{ github.repository }}/releases/tag/$VERSION)."
                    echo ""
                    echo "Next: open https://community.obsidian.md/account/plugins/tab-groups and select **Check for new releases**."
                  } >> "$GITHUB_STEP_SUMMARY"

    # 🧹 Delete the temporary branch, whether the release went through or not
    cleanup:
        needs: [prepare, publish]
        if: always() && needs.prepare.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/release/${{ inputs.version }}" || true

    # Tag pushed by hand (after bumping the version in a PR): build and create a draft release
    draft:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            # 🚀 The tag must match the version in manifest.json and be listed in versions.json,
            # or Obsidian won't offer the update.
            - name: Check version
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  version=$(node -p "require('./manifest.json').version")
                  if [ "$TAG" != "$version" ]; then
                    echo "::error file=manifest.json::Tag $TAG doesn't match manifest.json version $version"
                    exit 1
                  fi
                  if ! node -e "process.exit(require('./versions.json')['$TAG'] ? 0 : 1)"; then
                    echo "::error file=versions.json::versions.json has no entry for $TAG"
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${GITHUB_REF#refs/tags/}" --title="${GITHUB_REF#refs/tags/}" --draft main.js manifest.json styles.css
