name: Label pull request

# Adds area labels (translation, documentation, core, build) from .github/labeler.yml,
# and assigns the maintainer (the repository owner) when a pull request is opened.
# pull_request_target lets this work on pull requests from forks. It never checks out or runs the pull request's code.
on:
    pull_request_target:
        types: [opened, synchronize, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    label:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/labeler@v7
            # 💡 Only when opened or reopened, so removing the assignee by hand sticks
            - name: Assign the maintainer
              if: github.event.action != 'synchronize'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/assignees" -f "assignees[]=${{ github.repository_owner }}" --silent
