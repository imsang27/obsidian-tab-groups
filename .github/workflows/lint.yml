name: Node.js build

# 💻 Code: type check, build and lint. Skipped when only docs or GitHub templates change.
# Runs on pull requests, and on push only for main (so a pull request's commits aren't checked twice).
on:
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'LICENSE'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/pull_request_template.md'
            - '.github/labeler.yml'
    pull_request:
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'LICENSE'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/pull_request_template.md'
            - '.github/labeler.yml'

# A new push cancels the check still running for an older commit of the same branch or pull request.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            # main.js runs inside Obsidian, so one Node.js version (the one the release uses) is enough.
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
