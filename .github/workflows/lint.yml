name: Node.js build

# 💻 Code: type check, build, lint and unit tests.
# Runs on pull requests, and on push only for main (so a pull request's commits aren't checked twice).
# Only plugin code, tests and build settings matter here (see on.push.paths). "build" is a required check, so it
# always reports on pull requests: when none of those files change, the job runs but skips its steps.
on:
    push:
        branches: [main]
        paths:
            - 'src/**'
            - 'tests/**/*.ts'
            - 'tests/**/*.json'
            - 'styles.css'
            - 'manifest.json'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig.json'
            - 'eslint.config.mts'
            - 'esbuild.config.mjs'
            - 'vitest.config.mts'
            - '.npmrc'
            - '.github/workflows/lint.yml'
    pull_request:

# A new push cancels the check still running for an older commit of the same branch or pull request.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            # 💡 Only the files that can change this check's result (plugin code, tests, build settings). Same list as on.push.paths above.
            - name: Check for relevant changes
              id: changes
              run: |
                  if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
                  if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(src/|tests/.*\.(ts|mts|json)$|styles\.css$|manifest\.json$|package(-lock)?\.json$|tsconfig\.json$|eslint\.config\.mts$|esbuild\.config\.mjs$|vitest\.config\.mts$|\.npmrc$|\.github/workflows/lint\.yml$)'; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "code=false" >> "$GITHUB_OUTPUT"
                  fi
            # main.js runs inside Obsidian, so one Node.js version (the one the release uses) is enough.
            - uses: actions/setup-node@v7
              if: steps.changes.outputs.code == 'true'
              with:
                  node-version: 24
                  cache: 'npm'
            - if: steps.changes.outputs.code == 'true'
              run: npm ci
            - if: steps.changes.outputs.code == 'true'
              run: npm run build
            - if: steps.changes.outputs.code == 'true'
              run: npm run lint
            - if: steps.changes.outputs.code == 'true'
              run: npm test
