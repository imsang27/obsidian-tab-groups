# Labels pull requests by the files they change. Used by .github/workflows/labeler.yml.
translation:
    - changed-files:
          - any-glob-to-any-file:
                - 'src/i18n/locales/**'
                - 'docs/translating*.md'

documentation:
    - changed-files:
          - any-glob-to-any-file:
                - '**/*.md'
                - 'LICENSE'

core:
    - changed-files:
          - any-glob-to-any-file:
                - 'src/**/*.ts'
                - 'tests/**/*.ts'
                - 'styles.css'

build:
    - changed-files:
          - any-glob-to-any-file:
                - 'package.json'
                - 'package-lock.json'
                - '.npmrc'
                - '*.config.mjs'
                - '*.config.mts'
                - 'tsconfig.json'
                - 'version-bump.mjs'
                - 'scripts/**'
                - '.githooks/**'
                - '.github/workflows/**'
                - '.github/labeler.yml'
